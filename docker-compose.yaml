# nginx proxy address - http://172.17.0.1:8096

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  crafty:
    image: registry.gitlab.com/crafty-controller/crafty-4:latest
    container_name: crafty-app
    restart: unless-stopped
    logging: *default-logging
    networks:
      - crafty
    ports:
      - "8096:8000"
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./volumes/config/crafty:/config
      - ./volumes/data/crafty:/data

networks:
  crafty:
    external: false
